# Acme organization telemetry registry.
#
# Depends on a PINNED OpenTelemetry semantic conventions release and only adds
# what upstream does not own (the acme.* namespace). Bump the dependency in a
# reviewed PR; `weaver registry diff` will show what changed.
file_format: definition_manifest/2.0
name: acme
description: Acme organization semantic conventions (demo registry)
schema_url: https://telemetry.acme.example/schemas/1.0.0
dependencies:
  - schema_url: https://opentelemetry.io/schemas/1.42.0
    registry_path: https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v1.42.0.zip[model]
