# Semantic convention governance demo: two services, one Collector, Weaver
# live-check, New Relic. Copy .env.example to .env and set your license key.
#
#   docker compose up --build
#
# Both services run the same OpenTelemetry SDK. What differs is configuration
# and discipline, which is the point.

x-otel-common: &otel-common
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta   # New Relic prefers delta
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

services:
  checkout:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: checkout
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: ${CHECKOUT_SERVICE_NAME:-weaver-checkout}
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.4.2,deployment.environment.name=demo,acme.team=checkout-team
      OTEL_SEMCONV_STABILITY_OPT_IN: http        # emit stable HTTP conventions
    ports: ["${CHECKOUT_PORT:-8080}:8080"]   # host port; container stays 8080
    depends_on: [collector]

  legacy-cart:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: legacy_cart
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: ${LEGACY_CART_SERVICE_NAME:-weaver-legacy-cart}
      # Deprecated deployment.environment, no service.version, no acme.team,
      # and no OTEL_SEMCONV_STABILITY_OPT_IN. All deliberate.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=demo
    ports: ["8081:8081"]
    depends_on: [collector]

  loadgen:
    image: python:3.12-slim
    volumes: ["./services/loadgen:/loadgen:ro"]
    command: ["python", "-u", "/loadgen/loadgen.py"]
    depends_on: [checkout, legacy-cart]

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?set NEW_RELIC_LICENSE_KEY in .env}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net}
    depends_on: [weaver]

  # Continuous live-check: the "staging gate". Downloads semantic conventions
  # v1.42.0 from GitHub on startup (the registry's pinned dependency).
  weaver:
    image: otel/weaver:v0.28.0
    # Project mounted read-only; Weaver keeps its writable working dir (and any
    # downloaded dependency registries) in the image's home directory.
    working_dir: /home/weaver
    volumes: ["./:/work:ro"]
    command:
      - registry
      - live-check
      - --config=/work/.weaver.toml
      - --registry=/work/registry
      - --advice-policies=/work/policies/live_check
      - --otlp-grpc-address=0.0.0.0
      - --otlp-grpc-port=4317
      - --admin-port=4320
      - --inactivity-timeout=0     # never stop
      - --output=none              # findings go to OTLP, not the console
      - --no-stats                 # long-running session: don't accumulate stats
      - --emit-otlp-logs
      - --otlp-logs-endpoint=http://collector:14317
    ports: ["4320:4320"]           # admin API: GET /health
