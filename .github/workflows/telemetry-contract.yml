# Demo CI: simulate a build and a Weaver live-check. Safe to run repeatedly.
#
#   Actions > telemetry-contract > Run workflow   (or: gh workflow run telemetry-contract.yml)
#
# Needs no secrets: live-check runs inside the job and nothing is sent to New Relic.
# Each run grades BOTH services, so you see checkout pass and legacy-cart fail.
# Start warn-only (fail_on=none); set fail_on=violation to watch the gate go red.

name: telemetry-contract

on:
  workflow_dispatch:
    inputs:
      fail_on:
        description: Fail the job on findings at this level or higher
        type: choice
        default: none
        options: [none, violation, improvement]
  pull_request:

permissions:
  contents: read

env:
  WEAVER_VERSION: v0.28.0

jobs:
  registry:
    name: Registry check + codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Weaver
        run: |
          curl -sSfL "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin
          weaver --version
      - run: make check
      - run: make check-generated

  live-check:
    name: Live-check (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: registry
    strategy:
      fail-fast: false   # always grade both services
      matrix:
        include:
          - service: checkout
            dir: checkout
            port: 8080
            opt_in: http
          - service: legacy-cart
            dir: legacy_cart
            port: 8081
            opt_in: ""
    env:
      FAIL_ON: ${{ inputs.fail_on || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/requirements.txt
      - run: pip install -r services/requirements.txt
      - name: Install Weaver
        run: |
          curl -sSfL "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin

      - name: Start live-check
        run: |
          mkdir -p live-check-report
          weaver registry live-check \
            --config=.weaver.toml \
            --registry=registry \
            --advice-policies=policies/live_check \
            --otlp-grpc-address=127.0.0.1 --otlp-grpc-port=4317 \
            --admin-port=4320 \
            --inactivity-timeout=120 \
            --format=json --output=live-check-report \
            --fail-on="$FAIL_ON" \
            > live-check.log 2>&1 &
          echo $! > live-check.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4320/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4320/health || { cat live-check.log; exit 1; }

      - name: Run ${{ matrix.service }}
        env:
          OTEL_SERVICE_NAME: weaver-${{ matrix.service }}
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
          OTEL_EXPORTER_OTLP_PROTOCOL: grpc
          OTEL_METRIC_EXPORT_INTERVAL: "2000"
          OTEL_SEMCONV_STABILITY_OPT_IN: ${{ matrix.opt_in }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ matrix.service == 'checkout' && 'service.version=1.4.2,deployment.environment.name=ci,acme.team=checkout-team' || 'deployment.environment=ci' }}
          PYTHONPATH: services/common:services/${{ matrix.dir }}
        run: |
          python services/${{ matrix.dir }}/app.py > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:${{ matrix.port }}/healthz && break
            sleep 1
          done

      - name: Drive traffic
        run: |
          python services/loadgen/loadgen.py --once \
            --target ${{ matrix.service }}=http://127.0.0.1:${{ matrix.port }}

      - name: Stop service, flush telemetry, stop live-check
        run: |
          sleep 5                       # let batch exporters flush
          kill "$(cat app.pid)" || true
          sleep 3
          curl -s -X POST http://127.0.0.1:4320/stop || true
          # Weaver exits non-zero when findings reach FAIL_ON; that is the gate.
          if wait "$(cat live-check.pid)"; then status=0; else status=$?; fi
          echo "live-check exit code: $status"
          echo "$status" > live-check.status

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live-check: ${{ matrix.service }} (fail_on=$FAIL_ON)"
            echo "Exit code: \`$(cat live-check.status 2>/dev/null || echo n/a)\`"
            echo '```'
            tail -n 40 live-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-${{ matrix.service }}
          path: |
            live-check-report
            live-check.log
            app.log
          if-no-files-found: warn

      - name: Gate
        run: exit "$(cat live-check.status)"
