# Weaver live-check project config. Referenced by docker-compose.yaml (--config).
# Schema: weaver registry json-schema --json-schema weaver-config

# Acme attributes with `development` stability (e.g. acme.payment.method) would
# otherwise raise not_stable advice. They are ours and intentional, so drop it.
# Upstream OTel attributes still get not_stable advice.
[[live-check.finding_filters]]
exclude = ["not_stable"]
sample_names = ["acme.*"]

# The Flask/HTTP instrumentation emits http.server.active_requests, an upstream
# metric still at `development` stability. Nothing a service owner can fix, and it
# would fail fail_on=improvement for the conformant checkout service.
[[live-check.finding_filters]]
exclude = ["not_stable"]
sample_names = ["http.server.active_requests"]
